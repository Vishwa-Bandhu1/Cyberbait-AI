services:
  - type: web
    name: Cyberbait-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: java -jar /app/app.jar
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: AI_GATEWAY_TOKEN
        sync: false
      - key: AI_GATEWAY_URL
        value: https://ai-services.mietjmu.in/gateway/llm/chat
      - key: AI_GATEWAY_MODEL
        value: gpt-oss:20b
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_VERIFY_ON_STARTUP
        value: "true"
      - key: TESSERACT_DATA_PATH
        value: /usr/share/tesseract-ocr/5/tessdata
